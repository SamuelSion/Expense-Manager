name: Update interest rates

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rates from Bank of Israel
        run: python3 scripts/update-interest-rates.py

      - name: Commit only if the rates changed
        run: |
          if git diff --quiet -- data/interest-rates.json; then
            echo "Rates unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interest-rates.json
          git commit -m "Update interest rates"
          git push
