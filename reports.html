<!DOCTYPE html>
<html lang="he" dir="rtl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל הוצאות והכנסות | דו"חות</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-wrapper"></div>
    <header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-icon">💰</span> מנהל הוצאות והכנסות</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> דף בית</a></li>
                    <li class="nav-item"><a class="nav-link" href="filters.html"><i class="bi bi-funnel"></i> פילטרים</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-line"></i> דו"חות</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><i class="bi bi-info-circle"></i> אודות</a></li>
                </ul>
            </div>
        </div>
    </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="page-header animate-in"><h1>📊 דו"חות</h1><p>גרפים וייצוא נתונים — הוצאות, הכנסות, או שניהם</p></div>

            <!-- Chart Type Selector -->
            <div class="glass-card animate-in animate-delay-1">
                <div class="card-title"><i class="bi bi-toggles"></i> בחירת סוג נתונים לתצוגה</div>
                <div class="type-selector" id="chart-type-selector">
                    <button class="type-selector-btn" data-value="expenses">📉 הוצאות</button>
                    <button class="type-selector-btn" data-value="incomes">📈 הכנסות</button>
                    <button class="type-selector-btn active" data-value="both">📊 הוצאות והכנסות</button>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-lg-6 animate-in animate-delay-2">
                    <div class="glass-card">
                        <div class="card-title"><i class="bi bi-pie-chart"></i> חלוקה לפי קטגוריה</div>
                        <div class="chart-wrapper chart-height">
                            <canvas id="pie-chart"></canvas>
                            <div class="empty-state d-hidden" id="pie-empty"><div class="empty-icon">🥧</div><p>אין נתונים להצגה</p></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 animate-in animate-delay-3">
                    <div class="glass-card">
                        <div class="card-title"><i class="bi bi-bar-chart"></i> סיכום חודשי</div>
                        <div class="chart-wrapper chart-height">
                            <canvas id="bar-chart"></canvas>
                            <div class="empty-state d-hidden" id="bar-empty"><div class="empty-icon">📊</div><p>אין נתונים להצגה</p></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Export -->
            <div class="glass-card animate-in animate-delay-4">
                <div class="card-title"><i class="bi bi-download"></i> ייצוא נתונים</div>
                <div class="mb-3">
                    <label class="form-label" >בחירת סוג נתונים לייצוא:</label>
                    <div class="type-selector" id="export-type-selector">
                        <button class="type-selector-btn" data-value="expenses">📉 הוצאות</button>
                        <button class="type-selector-btn" data-value="incomes">📈 הכנסות</button>
                        <button class="type-selector-btn active" data-value="both">📊 שניהם</button>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-3">
                    <button class="btn-export pdf" id="export-pdf-btn"><i class="bi bi-file-earmark-pdf"></i> ייצוא PDF</button>
                    <button class="btn-export csv" id="export-csv-btn"><i class="bi bi-file-earmark-spreadsheet"></i> ייצוא CSV</button>
                </div>
            </div>
        </div>
    </main>

    <footer><div class="container">© 2026 מנהל הוצאות והכנסות — שמואל סיהון | כל הזכויות שמורות</div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
